# 按改动路径给 PR 打标签（actions/labeler）。标签需事先存在于仓库。
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
ios:
  - changed-files:
      - any-glob-to-any-file:
          - "Sonar/**"
          - "SonarWidgetExtension/**"
macos:
  - changed-files:
      - any-glob-to-any-file:
          - "SonarMac/**"
js-source:
  - changed-files:
      - any-glob-to-any-file:
          - "js-source/**"
